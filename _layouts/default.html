<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% include theme.html %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if page.math %}{% include math.html %}{% endif %}
</head>
<body>
  {% include header.html %}
  <main>{{ content }}</main>
  {% unless page.home %}<footer class="bottom-footer"><small><a href="{{ '/feed.xml' | relative_url }}">RSS</a></small></footer>{% endunless %}
</body>
</html>
